name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m rlt_rsi.train --backend numpy --train-size 64 --dev-size 32 --heldout-size 32 --epochs 4 --output results/ci.json
